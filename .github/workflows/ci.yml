name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test with coverage
        run: bun run test:coverage
      - name: Build
        run: bun run build
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t=require("./coverage/coverage-summary.json").total;
              const r=["lines","statements","functions","branches"].map(k=>`| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`);
              console.log(["### Test coverage","","| Metric | % | Covered |","|---|---|---|",...r].join("\n"));
            ' > coverage-comment.md
            cat coverage-comment.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('coverage-comment.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        continue-on-error: true
        with:
          header: coverage
          path: coverage-comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
