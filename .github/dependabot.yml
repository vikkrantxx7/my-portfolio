version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Only propose versions released at least a week ago; security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      dependencies:
        dependency-type: production
        patterns: ["*"]
      dev-dependencies:
        dependency-type: development
        patterns: ["*"]
